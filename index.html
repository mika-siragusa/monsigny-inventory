<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monsigny">
<meta name="theme-color" content="#d4a853">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230f0f0f' width='192' height='192'/><text x='96' y='120' font-size='80' text-anchor='middle' fill='%23d4a853' font-family='Arial' font-weight='bold'>📦</text></svg>">
<title>Inventaire Monsigny</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0f0f; color: #e8e8e8; font-family: 'DM Sans', sans-serif; height: 100vh; }
.container { display: flex; flex-direction: column; height: 100vh; }
.header { background: #1a1a1a; border-bottom: 1px solid #303030; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
.title { font-size: 18px; font-weight: 600; color: #d4a853; }
.badge { background: #242424; padding: 6px 12px; border-radius: 4px; font-size: 12px; }
.tabs { background: #1a1a1a; border-bottom: 1px solid #303030; padding: 10px 20px; display: flex; gap: 10px; }
.tab { padding: 8px 16px; border: 1px solid #303030; background: transparent; color: #c0c0c0; cursor: pointer; border-radius: 4px; flex: 1; }
.tab.active { background: #d4a853; color: #1a1000; border-color: #d4a853; }
.search-bar { padding: 12px 20px; background: #1a1a1a; border-bottom: 1px solid #303030; }
.search-inp { width: 100%; background: #0f0f0f; border: 1px solid #242424; color: #e8e8e8; padding: 10px 12px; border-radius: 4px; }
.content { flex: 1; overflow-y: scroll; padding: 12px 20px 140px; }
.section { margin: 15px 0 2px; padding: 10px 15px; background: #1a1a1a; border: 1px solid #303030; border-radius: 6px; font-weight: 600; color: #d4a853; font-size: 12px; }
.product { background: #1a1a1a; border: 1px solid #303030; border-radius: 4px; padding: 12px; margin: 8px 0; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr 40px 40px; gap: 10px; align-items: center; }
.product-name { font-size: 13px; font-weight: 500; }
.product-unit { font-size: 11px; color: #808080; }
input[type="text"], select { background: #0f0f0f; border: 1px solid #242424; color: #e8e8e8; padding: 8px; border-radius: 4px; font-size: 13px; width: 100%; }
input:focus, select:focus { border-color: #d4a853; }
.buttons { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; border-top: 1px solid #303030; padding: 10px 20px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 100; }
button { padding: 8px 12px; border: 1px solid #303030; background: #242424; color: #e8e8e8; cursor: pointer; border-radius: 4px; font-size: 12px; font-weight: 500; }
button:hover { background: #303030; }
.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.95); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal-box { background: #1a1a1a; border: 1px solid #303030; padding: 30px; max-width: 450px; width: 90%; border-radius: 8px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 20px; font-weight: 600; color: #d4a853; margin-bottom: 20px; }
.modal-group { margin-bottom: 15px; }
.modal-label { font-size: 11px; color: #c0c0c0; margin-bottom: 8px; display: block; font-weight: 600; }
.modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
.modal-buttons button { flex: 1; padding: 10px; }
.btn-accent { background: #d4a853; color: #1a1000; border-color: #d4a853; }
.btn-danger { background: #ef4444; color: #fff; border-color: #ef4444; }
.btn-success { background: #4ade80; color: #000; border-color: #4ade80; }
.hist-item { background: #242424; padding: 12px; margin: 8px 0; border-radius: 4px; border-left: 3px solid #d4a853; cursor: pointer; }
.hist-item:hover { background: #303030; }
.hist-date { font-weight: 600; color: #d4a853; }
.hist-sub { font-size: 12px; color: #808080; margin-top: 4px; }
</style>
</head>
<body>

<div id="auth" class="modal">
<div class="modal-box">
<div class="modal-title">📦 Inventaire Monsigny</div>
<div class="modal-group">
<label class="modal-label">Choisir un lieu</label>
<select id="loc">
<option value="">-- Sélectionner --</option>
<option value="restaurant">🏢 RESTAURANT</option>
<option value="rooftop">🌙 ROOFTOP</option>
</select>
</div>
<div class="modal-group">
<label class="modal-label">Votre nom</label>
<input type="text" id="usr" placeholder="Ex: Marie">
</div>
<div class="modal-buttons">
<button class="btn-accent" onclick="login()">Accéder</button>
</div>
</div>
</div>

<div id="app" style="display:none" class="container">
<div class="header">
<div class="title">📦 Inventaire Monsigny</div>
<div style="display:flex; gap:15px; align-items:center;">
<span class="badge" id="locbadge">RESTAURANT</span>
<button onclick="logout()" style="padding:6px 12px; font-size:11px;">Quitter</button>
</div>
</div>

<div class="tabs">
<button class="tab active" onclick="switchTab('inventory')">📊 Inventaire</button>
<button class="tab" onclick="switchTab('history')">📜 Historique</button>
</div>

<!-- INVENTAIRE TAB -->
<div id="inventoryTab" style="display:flex; flex-direction:column; flex:1;">
<div class="search-bar">
<input class="search-inp" type="text" placeholder="🔍 Rechercher..." id="search" oninput="render()">
</div>
<div class="content" id="cont">Chargement...</div>
</div>

<!-- HISTORIQUE TAB -->
<div id="historyTab" style="display:none; flex:1; overflow-y:scroll; padding:20px;">
<div id="histContent">Aucun historique</div>
</div>

<div class="buttons">
<button onclick="exp()">💾 Export JSON</button>
<button onclick="document.getElementById('fi').click()">📥 Import JSON</button>
<input type="file" id="fi" accept=".json" onchange="imp(event)" style="display:none">
<button onclick="csv()">📊 CSV</button>
<button onclick="exportPDF()">📄 PDF</button>
<button onclick="toggleAdd()" style="background:#d4a853; color:#1a1000; font-weight:600">➕ Ajouter</button>
<button onclick="resetInventory()" style="background:#ef4444; color:#fff; font-weight:600">🔄 Réinitialiser</button>
<button id="totalBtn" style="background:#4ade80; color:#000; font-weight:600; flex:1">💰 TOTAL: 0.00€</button>
<button onclick="saveInventory()" style="background:#4ade80; color:#fff; font-weight:600; flex:1; border-color:#4ade80">✅ Enregistrer Inventaire</button>
</div>
</div>

<!-- MODAL AJOUTER PRODUIT -->
<div id="addModal" class="modal" style="display:none">
<div class="modal-box">
<div class="modal-title">➕ Ajouter un produit</div>
<div class="modal-group">
<label class="modal-label">Catégorie</label>
<select id="addCat">
<option value="">-- Sélectionner --</option>
<option value="VINS / BIÈRES">VINS / BIÈRES</option>
<option value="SPIRITUEUX">SPIRITUEUX</option>
<option value="SOFTS">SOFTS</option>
<option value="SIROPS / PUREES">SIROPS / PUREES</option>
<option value="CAFETERIE">CAFETERIE</option>
<option value="CUISINE">CUISINE</option>
</select>
</div>
<div class="modal-group">
<label class="modal-label">Nom du produit</label>
<input type="text" id="addName" placeholder="Ex: Coca Cola">
</div>
<div class="modal-group">
<label class="modal-label">Unité</label>
<input type="text" id="addUnit" placeholder="Ex: btl, L, KG">
</div>
<div class="modal-group">
<label class="modal-label">Prix</label>
<input type="text" id="addPrice" placeholder="Ex: 5,50">
</div>
<div class="modal-buttons">
<button class="btn-success" onclick="addProd()">✅ Ajouter</button>
<button class="btn-danger" onclick="toggleAdd()">❌ Annuler</button>
</div>
</div>
</div>

<!-- MODAL DÉPLACER PRODUIT -->
<div id="moveModal" class="modal" style="display:none">
<div class="modal-box">
<div class="modal-title">↔️ Déplacer un produit</div>
<div style="margin-bottom:15px; padding:15px; background:#0f0f0f; border-radius:4px; color:#d4a853;">
<strong id="moveProdName"></strong>
</div>
<div class="modal-group">
<label class="modal-label">Vers quelle catégorie ?</label>
<select id="moveCat">
<option value="">-- Sélectionner --</option>
<option value="VINS / BIÈRES">VINS / BIÈRES</option>
<option value="SPIRITUEUX">SPIRITUEUX</option>
<option value="SOFTS">SOFTS</option>
<option value="SIROPS / PUREES">SIROPS / PUREES</option>
<option value="CAFETERIE">CAFETERIE</option>
<option value="CUISINE">CUISINE</option>
</select>
</div>
<div class="modal-buttons">
<button class="btn-success" onclick="confirmMove()">✅ Déplacer</button>
<button class="btn-danger" onclick="cancelMove()">❌ Annuler</button>
</div>
</div>
</div>

let loc='restaurant', usr='', st={}, hist=[];

function login(){
  const l = document.getElementById('loc').value;
  const u = document.getElementById('usr').value || 'Utilisateur';
  if(!l) { alert('Choisis un lieu!'); return; }
  loc = l;
  usr = u;
  localStorage.setItem('ml', l);
  localStorage.setItem('mu', u);
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('locbadge').textContent = l.toUpperCase();
  loadData();
  loadHistory();
}

function logout(){
  if(confirm('Quitter?')) {
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth').style.display = 'flex';
  }
}

function switchTab(tab){
  if(tab === 'inventory') {
    document.getElementById('inventoryTab').style.display = 'flex';
    document.getElementById('historyTab').style.display = 'none';
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.querySelectorAll('.tab')[1].classList.remove('active');
  } else {
    document.getElementById('inventoryTab').style.display = 'none';
    document.getElementById('historyTab').style.display = 'block';
    document.querySelectorAll('.tab')[0].classList.remove('active');
    document.querySelectorAll('.tab')[1].classList.add('active');
    renderHistory();
  }
}

function loadData(){
  const saved = localStorage.getItem(SYNC_KEY + loc);
  st = saved ? JSON.parse(saved) : {};
  render();
}

function saveData(){
  localStorage.setItem(SYNC_KEY + loc, JSON.stringify(st));
}

function loadHistory(){
  const saved = localStorage.getItem(HIST_KEY + loc);
  hist = saved ? JSON.parse(saved) : [];
}

function saveHistory(){
  localStorage.setItem(HIST_KEY + loc, JSON.stringify(hist));
}

function saveInventory(){
  const total = calculateTotal();
  const now = new Date();
  const date = now.toLocaleDateString('fr-FR');
  const month = now.toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
  
  // Demander un nom pour l'inventaire
  const name = prompt('📝 Donne un nom à cet inventaire (optionnel):', date + ' - ' + usr);
  
  const inv = {
    id: Date.now(),
    name: name || (date + ' - ' + usr),
    date: date,
    month: month,
    time: now.toLocaleTimeString('fr-FR'),
    user: usr,
    total: total,
    items: {}
  };
  
  for(const[c,it] of Object.entries(PROD)){
    inv.items[c] = [];
    it.forEach(p => {
      const id = c + ':' + p.name;
      const d = st[id] || {};
      const q = d.q || 0;
      if(q > 0) {
        inv.items[c].push({
          name: p.name,
          qty: q,
          price: d.p || p.p,
          supplier: d.sup || '',
          value: q * (d.p || p.p)
        });
      }
    });
  }
  
  hist.unshift(inv);
  saveHistory();
  alert('✅ Inventaire enregistré: "' + inv.name + '"');
  
  // Auto-export JSON
  const backup = {loc: loc, ts: now.toISOString(), inv: st, history: hist};
  const b = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
  const l = document.createElement('a');
  l.href = URL.createObjectURL(b);
  l.download = 'monsigny-' + loc + '-backup-' + now.toISOString().split('T')[0] + '.json';
  l.click();
}

function renderHistory(){
  let h = '<h3 style="color:#d4a853; margin-bottom:20px;">📜 Historique des inventaires</h3>';
  
  if(!hist.length) {
    h += '<div style="color:#808080;">Aucun inventaire enregistré</div>';
    document.getElementById('histContent').innerHTML = h;
    return;
  }
  
  // Grouper par mois
  const byMonth = {};
  hist.forEach(inv => {
    if(!byMonth[inv.month]) byMonth[inv.month] = [];
    byMonth[inv.month].push(inv);
  });
  
  for(const[month, invs] of Object.entries(byMonth)) {
    h += '<div style="margin-top:20px;"><h4 style="color:#d4a853; margin-bottom:10px;">📅 ' + month + '</h4>';
    invs.forEach((inv, idx) => {
      const itemCount = Object.values(inv.items).reduce((sum, arr) => sum + arr.length, 0);
      const histIdx = hist.indexOf(inv);
      h += `<div style="background:#242424; padding:12px; margin:8px 0; border-radius:4px; border-left:3px solid #d4a853;">

          <div style="flex:1; cursor:pointer;" onclick="viewInventory(${histIdx})">
            <div style="color:#d4a853; font-weight:600;">${inv.name}</div>
            <div style="color:#808080; font-size:12px; margin-top:4px;">📅 ${inv.date} à ${inv.time} • 👤 ${inv.user} • ${itemCount} produits • 💰 ${inv.total.toFixed(2)}€</div>
          </div>
          <div style="display:flex; gap:4px;">
            <button onclick="renameInventory(${histIdx})" style="background:#5b9cf6; color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; font-size:11px;">✏️ Renommer</button>
            <button onclick="deleteInventory(${histIdx})" style="background:#ef4444; color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; font-size:11px;">🗑️ Supprimer</button>
          </div>
        </div>
      </div>`;
    });
    h += '</div>';
  }
  
  document.getElementById('histContent').innerHTML = h;
}

function viewInventory(idx){
  const inv = hist[idx];
  let detail = '<h3 style="color:#d4a853; margin-bottom:20px;">📊 ' + inv.name + '</h3>';
  detail += '<p style="color:#808080; margin-bottom:20px;">👤 ' + inv.user + ' • 📅 ' + inv.date + ' • 💰 Total: <strong style="color:#4ade80">' + inv.total.toFixed(2) + '€</strong></p>';
  
  for(const[cat, items] of Object.entries(inv.items)) {
    if(!items.length) continue;
    detail += '<div style="margin-top:15px;"><h4 style="color:#d4a853;">' + cat + '</h4>';
    items.forEach(item => {
      detail += `<div style="background:#242424; padding:8px; margin:4px 0; border-radius:4px; font-size:12px;">
        <div><strong>${item.name}</strong> - ${item.qty} × ${item.price.toFixed(2)}€ = <strong style="color:#4ade80">${item.value.toFixed(2)}€</strong></div>
        <div style="color:#808080; margin-top:2px;">Fournisseur: ${item.supplier || '—'}</div>

  }

  document.getElementById('histContent').innerHTML = detail;
}

function renameInventory(idx){
  const inv = hist[idx];
  const newName = prompt('📝 Nouveau nom pour cet inventaire:', inv.name);
  if(newName && newName.trim()) {
    hist[idx].name = newName.trim();
    saveHistory();
    renderHistory();
    alert('✅ Inventaire renommé en "' + newName + '"');
  }
}

function deleteInventory(idx){
  const inv = hist[idx];
  if(confirm('❌ Supprimer l\'inventaire "' + inv.name + '" ?')) {
    hist.splice(idx, 1);
    saveHistory();
    renderHistory();
    alert('✅ Inventaire supprimé');
  }
}

function moveInventoryModal(idx){
  const inv = hist[idx];
  const locations = ['restaurant', 'rooftop'];
  let otherLocs = locations.filter(l => l !== loc);
  
  let html = '<div style="background:#1a1a1a; border:1px solid #303030; padding:20px; border-radius:8px; max-width:400px;">';
  html += '<h3 style="color:#d4a853; margin-bottom:20px;">↔️ Déplacer cet inventaire</h3>';
  html += '<p style="color:#808080; margin-bottom:20px;">Inventaire actuel: <strong style="color:#d4a853;">' + loc.toUpperCase() + '</strong></p>';
  html += '<p style="color:#c0c0c0; margin-bottom:20px;">Vers quel lieu?</p>';
  
  otherLocs.forEach(destLoc => {
    html += '<button onclick="moveInventoryTo(' + idx + ', \'' + destLoc + '\')" style="display:block; width:100%; background:#f97316; color:#fff; border:none; padding:12px; margin-bottom:10px; border-radius:4px; cursor:pointer; font-weight:600;">📍 ' + destLoc.toUpperCase() + '</button>';
  });
  
  html += '<button onclick="switchTab(\'history\')" style="display:block; width:100%; background:#303030; color:#e8e8e8; border:none; padding:10px; border-radius:4px; cursor:pointer;">❌ Annuler</button>';
  html += '</div>';
  
  document.getElementById('histContent').innerHTML = html;
}

function moveInventoryTo(idx, destLoc){
  const inv = hist[idx];
  
  // Vérifier si un inventaire avec le même nom existe à la destination
  const destHist = JSON.parse(localStorage.getItem(HIST_KEY + destLoc) || '[]');
  const exists = destHist.some(h => h.name === inv.name);
  
  if(exists) {
    if(!confirm('⚠️ Un inventaire portant le même nom existe déjà à ' + destLoc.toUpperCase() + '. Continuer ?')) {
      return;
    }
  }
  
  // Retirer de l'historique actuel
  hist.splice(idx, 1);
  saveHistory();
  
  // Ajouter à l'historique de la destination
  destHist.unshift(inv);
  localStorage.setItem(HIST_KEY + destLoc, JSON.stringify(destHist));
  
  alert('✅ Inventaire "' + inv.name + '" déplacé vers ' + destLoc.toUpperCase());
  renderHistory();
}

function render(){
  const s = document.getElementById('search').value.toUpperCase();
  let h = '';
  for(const[c,it] of Object.entries(PROD)){
    const f = it.filter(p => !s || p.name.includes(s));
    if(!f.length)continue;
    h += '<div class="section">'+c+'</div>';
    f.forEach((p,idx) => {
      const id = c + ':' + p.name;
      const d = st[id] || {};
      const q = d.q || 0;
      const pr = d.p || p.p;
      const sup = d.sup || '';
      const val = q * pr;
      h += '<div class="product"><div><div class="product-name">'+p.name+'</div><div class="product-unit">'+p.u+'</div></div><input type="text" value="'+pr.toFixed(2)+'" onchange="setPrice(\''+id+'\',this.value)" style="width:80px; text-align:right"/><input type="text" value="'+q+'" onchange="setQty(\''+id+'\',this.value)" style="width:80px"/><div style="text-align:right">'+val.toFixed(2)+'€</div><input type="text" value="'+sup+'" onchange="setSupplier(\''+id+'\',this.value)" placeholder="Fournisseur" style="width:100px"/><button onclick="startMove(\''+c+'\',\''+p.name+'\')" style="background:#5b9cf6; color:#fff; border:none; cursor:pointer; padding:6px 8px; border-radius:4px; font-size:11px;">↔️</button></div>';
    });
  }
  document.getElementById('cont').innerHTML = h;
  document.getElementById('totalBtn').textContent = '💰 TOTAL: ' + calculateTotal().toFixed(2) + '€';
}

function calculateTotal(){
  let total = 0;
  for(const[c,it] of Object.entries(PROD)){
    it.forEach(p => {
      const id = c + ':' + p.name;
      const d = st[id] || {};
      const q = d.q || 0;
      const pr = d.p || p.p;
      total += q * pr;
    });
  }
  return total;
}

function resetInventory(){
  if(confirm('🔄 Remettre à ZÉRO toutes les quantités ? Cette action ne peut pas être annulée!')) {
    st = {};
    saveData();
    render();
    alert('✅ Inventaire réinitialisé! Tu peux commencer un nouveau.');
  }
}

function setQty(id, val){
  const q = parseFloat(val.replace(',','.')) || 0;
  st[id] = st[id] || {};
  st[id].q = q;
  saveData();
  render();
}

function setPrice(id, val){
  const p = parseFloat(val.replace(',','.')) || 0;
  st[id] = st[id] || {};
  st[id].p = p;
  saveData();
  render();
}

function setSupplier(id, val){
  st[id] = st[id] || {};
  st[id].sup = val.toUpperCase();
  saveData();
}

function toggleAdd(){
  const m = document.getElementById('addModal');
  m.style.display = m.style.display === 'none' ? 'flex' : 'none';
}

function addProd(){
  const cat = document.getElementById('addCat').value;
  const name = document.getElementById('addName').value.toUpperCase();
  const unit = document.getElementById('addUnit').value;
  const price = parseFloat((document.getElementById('addPrice').value).replace(',','.'));
  
  if(!cat || !name || !unit || !price) { alert('Remplis tous les champs!'); return; }
  
  if(!PROD[cat]) PROD[cat] = [];
  PROD[cat].push({name: name, p: price, u: unit, sup: ''});
  
  document.getElementById('addCat').value = '';
  document.getElementById('addName').value = '';
  document.getElementById('addUnit').value = '';
  document.getElementById('addPrice').value = '';
  
  toggleAdd();
  alert('✅ Produit ajouté!');
  render();
}

let moveData = {};
function startMove(cat, name){
  moveData = {cat: cat, name: name};
  document.getElementById('moveProdName').textContent = name + ' (de ' + cat + ')';
  document.getElementById('moveCat').value = '';
  document.getElementById('moveModal').style.display = 'flex';
}

function confirmMove(){
  const newCat = document.getElementById('moveCat').value;
  if(!newCat) { alert('Choisis une catégorie!'); return; }
  if(newCat === moveData.cat) { alert('Sélectionne une catégorie différente!'); return; }
  
  const idx = PROD[moveData.cat].findIndex(p => p.name === moveData.name);
  if(idx !== -1) {
    const prod = PROD[moveData.cat][idx];
    PROD[moveData.cat].splice(idx, 1);
    if(!PROD[newCat]) PROD[newCat] = [];
    PROD[newCat].push(prod);
    
    const oldId = moveData.cat + ':' + moveData.name;
    const newId = newCat + ':' + moveData.name;
    if(st[oldId]) {
      st[newId] = st[oldId];
      delete st[oldId];
      saveData();
    }
    
    cancelMove();
    alert('✅ Produit déplacé!');
    render();
  }
}

function cancelMove(){
  document.getElementById('moveModal').style.display = 'none';
  moveData = {};
}

function exp(){
  const backup = {loc: loc, ts: new Date().toISOString(), inv: st, history: hist};
  const b = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
  const l = document.createElement('a');
  l.href = URL.createObjectURL(b);
  l.download = 'monsigny-' + loc + '.json';
  l.click();
}

function imp(e){
  const f = e.target.files[0];
  if(!f)return;
  const r = new FileReader();
  r.onload = (ev) => {
    try {
      const d = JSON.parse(ev.target.result);
      const fileLoc = d.loc || loc;
      const data = d.inv || d.inventory || d;
      
      if(data && typeof data === 'object') {
        localStorage.setItem(SYNC_KEY + fileLoc, JSON.stringify(data));
        if(d.history) {
          localStorage.setItem(HIST_KEY + fileLoc, JSON.stringify(d.history));
          loadHistory();
        }
        if(loc === fileLoc) {
          st = data;
          render();
        }
        alert('✅ Importé avec succès!');
      }
    } catch(er) { alert('❌ Erreur: '+er.message); }
  };
  r.readAsText(f);
  document.getElementById('fi').value = '';
}

function csv(){
  let c = 'Lieu,Catégorie,Produit,Unité,Prix,Qty,Valeur,Fournisseur\n';
  for(const[cat,it] of Object.entries(PROD)){
    it.forEach(p => {
      const id = cat + ':' + p.name;
      const d = st[id] || {};
      const q = d.q || 0;
      const price = d.p || p.p;
      const sup = d.sup || '';
      const v = q * price;
      c += '"'+loc+'","'+cat+'","'+p.name+'","'+p.u+'",'+price+','+q+','+v.toFixed(2)+',"'+sup+'"\n';
    });
  }
  const b = new Blob([c], {type: 'text/csv'});
  const l = document.createElement('a');
  l.href = URL.createObjectURL(b);
  l.download = 'monsigny-' + loc + '.csv';
  l.click();
}

const s = localStorage.getItem('ml');
if(s) {
  document.getElementById('loc').value = s;
  document.getElementById('usr').value = localStorage.getItem('mu');
}
</script>

              <th style="padding: 10px; text-align: left; font-weight: bold; color: #333; border: 1px solid #ddd;">Produit</th>
              <th style="padding: 10px; text-align: right; font-weight: bold; color: #333; border: 1px solid #ddd;">Qty</th>
              <th style="padding: 10px; text-align: right; font-weight: bold; color: #333; border: 1px solid #ddd;">Prix</th>
              <th style="padding: 10px; text-align: right; font-weight: bold; color: #333; border: 1px solid #ddd;">Total</th>
              <th style="padding: 10px; text-align: left; font-weight: bold; color: #333; border: 1px solid #ddd;">Fournisseur</th>
            </tr>
          </thead>
          <tbody>
    `;
    
    items.forEach(item => {
      html += `
        <tr style="border-bottom: 1px solid #ddd;">
          <td style="padding: 8px; border: 1px solid #ddd;">${item.name}</td>
          <td style="padding: 8px; text-align: right; border: 1px solid #ddd;">${item.qty.toFixed(2)}</td>
          <td style="padding: 8px; text-align: right; border: 1px solid #ddd;">${item.price.toFixed(2)}€</td>
          <td style="padding: 8px; text-align: right; border: 1px solid #ddd; font-weight: bold; color: #d4a853;">${item.value.toFixed(2)}€</td>
          <td style="padding: 8px; border: 1px solid #ddd;">${item.supplier || '—'}</td>
        </tr>
      `;
    });
    
    html += `
          </tbody>
        </table>
      </div>
    `;
  }
  
  // MONTANT TOTAL DEPUIS L'INVENTAIRE SAUVEGARDÉ
  html += `
      </div>
      
      <!-- TOTAL -->
      <div style="background: linear-gradient(135deg, #d4a853 0%, #c89d3c 100%); color: white; padding: 20px; border-radius: 4px; text-align: center; margin-top: 30px;">
        <h2 style="margin: 0; font-size: 24px;">💰 MONTANT TOTAL</h2>
        <p style="margin: 10px 0 0 0; font-size: 36px; font-weight: bold;">${total.toFixed(2)}€</p>
      </div>
      
      <!-- FOOTER -->
      <div style="text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; color: #999; font-size: 12px;">
        <p>Inventaire: ${inv.name}</p>
        <p>Monsigny - Système d'inventaire</p>
      </div>
      
    </div>
  </div>
  `;
  
  const element = document.createElement('div');
  element.innerHTML = html;
  
  const opt = {
    margin: 10,
    filename: inv.name.replace(/\s+/g, '_') + '.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
  };
  
  html2pdf().set(opt).from(element).save();
}

// Enregistrer le service worker pour le mode offline
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js')
      .then(registration => {
        console.log('✅ Service Worker enregistré:', registration);
      })
      .catch(error => {
        console.log('Service Worker enregistrement échoué:', error);
      });
  });
}
</script>
</script>

</body>
</html>
